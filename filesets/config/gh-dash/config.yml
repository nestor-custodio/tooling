# yaml-language-server: $schema=https://gh-dash.dev/schema.json

prSections:
    - title: My Pull Requests
      filters: is:open author:@me
    - title: Needs My Review
      filters: is:open review-requested:@me
    - title: Involved
      filters: is:open involves:@me -author:@me
issuesSections:
    - title: My Issues
      filters: is:open author:@me
    - title: Assigned
      filters: is:open assignee:@me
    - title: Involved
      filters: is:open involves:@me -author:@me
notificationsSections:
    - title: All
      filters: ""
    - title: Created
      filters: reason:author
    - title: Participating
      filters: reason:participating
    - title: Mentioned
      filters: reason:mention
    - title: Review Requested
      filters: reason:review-requested
    - title: Assigned
      filters: reason:assign
    - title: Subscribed
      filters: reason:subscribed
    - title: Team Mentioned
      filters: reason:team-mention
repo:
    branchesRefetchIntervalSeconds: 30
    prsRefetchIntervalSeconds: 60
defaults:
    preview:
        open: false
        width: 0.45
        height: 0.6
        position: auto
    prsLimit: 20
    prApproveComment: LGTM
    issuesLimit: 20
    notificationsLimit: 20
    view: prs
    layout:
        prs:
            updatedAt:
                width: 5
            createdAt:
                width: 5
            repo:
                width: 20
            author:
                width: 15
            authorIcon:
                hidden: false
            labels:
                width: 22
                hidden: true
            assignees:
                width: 20
                hidden: true
            base:
                width: 15
                hidden: true
            lines:
                width: 15
        issues:
            updatedAt:
                width: 5
            createdAt:
                width: 5
            repo:
                width: 15
            creator:
                width: 10
            creatorIcon:
                hidden: false
            assignees:
                width: 20
                hidden: true
    refetchIntervalMinutes: 30
repoPaths: {}
theme:
    ui:
        sectionsShowCount: true
        table:
            showSeparator: true
            compact: false
pager:
    diff: 'delta'
confirmQuit: false
showAuthorIcons: true
smartFilteringAtLaunch: true
includeReadNotifications: true

# ---

# See: https://www.gh-dash.dev/configuration/keybindings/
#
keybindings:

    universal:

        - { builtin: 'nextSection'       , key: 'tab'       }
        - { builtin: 'prevSection'       , key: 'shift+tab' }

        - { builtin: 'firstLine'         , key: '['         }
        - { builtin: 'pageUp'            , key: 'I'         }
        - { builtin: 'up'                , key: 'i'         }
        - { builtin: 'down'              , key: 'k'         }
        - { builtin: 'pageDown'          , key: 'K'         }
        - { builtin: 'lastLine'          , key: ']'         }

        - { builtin: 'refresh'           , key: 'r'         }
        - { builtin: 'refreshAll'        , key: 'R'         }
        - { builtin: 'togglePreview'     , key: 'space'     }
        - { builtin: 'search'            , key: '/'         }
        - { builtin: 'copyurl'           , key: 'c'         }
        - { builtin: 'copyNumber'        , key: ''          }
        - { builtin: 'openGithub'        , key: ''          }

        - { builtin: 'redraw'            , key: '!'         }
        - { builtin: 'help'              , key: '?'         }
        - { builtin: 'quit'              , key: 'q'         }

    prs:
        - { builtin: 'prevSidebarTab'    , key: 'u'         }
        - { builtin: 'nextSidebarTab'    , key: 'o'         }
        - { builtin: 'approve'           , key: ''          }
        - { builtin: 'assign'            , key: '>'         }
        - { builtin: 'unassign'          , key: '<'         }
        - { builtin: 'comment'           , key: 'enter'     }
        - { builtin: 'diff'              , key: 'v'         }
        - { builtin: 'checkout'          , key: ''          }
        - { builtin: 'close'             , key: ''          }
        - { builtin: 'ready'             , key: ''          }
        - { builtin: 'reopen'            , key: ''          }
        - { builtin: 'merge'             , key: ''          }
        - { builtin: 'update'            , key: ''          }
        - { builtin: 'watchChecks'       , key: ''          }
        - { builtin: 'approveWorkflows'  , key: ''          }
        - { builtin: 'viewIssues'        , key: '.'         }
        - { builtin: 'summaryViewMore'   , key: ''          }

    issues:
        - { builtin: 'label'             , key: 'l'         }
        - { builtin: 'assign'            , key: '>'         }
        - { builtin: 'unassign'          , key: '<'         }
        - { builtin: 'comment'           , key: 'enter'     }
        - { builtin: 'checkout'          , key: ''          }
        - { builtin: 'close'             , key: ''          }
        - { builtin: 'reopen'            , key: ''          }
        - { builtin: 'viewPrs'           , key: '.'         }

    notifications:
        - { builtin: 'view'              , key: 'enter'     }
        - { builtin: 'markAsDone'        , key: 'space'     }
        - { builtin: 'markAllAsDone'     , key: ''          }
        - { builtin: 'markAsRead'        , key: 'r'         }
        - { builtin: 'markAllAsRead'     , key: ''          }
        - { builtin: 'unsubscribe'       , key: ''          }
        - { builtin: 'toggleBookmark'    , key: '^'         }

    completions:
        - { builtin: 'nextSuggestion'    , key: ''          }
        - { builtin: 'previousSuggestion', key: ''          }
        - { builtin: 'selectSuggestion'  , key: ''          }
        - { builtin: 'toggleSuggestions' , key: ''          }
        - { builtin: 'refreshSuggestions', key: ''          }
